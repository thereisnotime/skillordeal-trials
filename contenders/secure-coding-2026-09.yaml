# Secure code review contenders, surveyed 2026-09-23.
# Schema: skillordeal Contender (src/skillordeal/config.py). Every ref is a full commit
# sha and every subpath was checked with `gh api repos/<o>/<r>/contents/<subpath>?ref=<sha>`.
#
# No contender gets extra_tools. Several upstream prompts ask for Task (subagents), Write
# or git diff; in the sandbox those steps are unavailable and the model has to work
# inline and read-only. That is the same for everyone, including the baseline.
contenders:
  # --- standalone skills (SKILL.md directories) ---------------------------------

  - id: cf-security-audit
    kind: skill
    repo: https://github.com/cloudflare/security-audit-skill
    ref: c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
    subpath: skills/security-audit
    strip: ["*.cjs"]
    role: finder
    license: MIT
    notes: >-
      Largest single skill in the survey (SKILL.md ~3.1k words plus 15 topic files, ~25k
      words total). Full-audit mode wants node to run validate-findings.cjs and
      validate-coverage-ledger.cjs; there is no node in the sandbox, so the .cjs
      validators and their tests are stripped and the skill runs without that step.

  - id: sentry-security-review
    kind: skill
    repo: https://github.com/getsentry/skills
    ref: c2f99a5b04b4cd992ec3022d7c2c3e23e938d241
    subpath: skills/security-review
    role: finder
    license: Apache-2.0
    notes: Confidence-based reporting, fully read-only. Ships python/javascript language guides.

  - id: sentry-code-review
    kind: skill
    repo: https://github.com/getsentry/skills
    ref: c2f99a5b04b4cd992ec3022d7c2c3e23e938d241
    subpath: skills/code-review
    role: general-review
    license: Apache-2.0
    notes: Thin (~370 words) general review checklist. Control for "any review skill at all".

  - id: openai-security-best-practices
    kind: skill
    repo: https://github.com/openai/skills
    ref: 49f948faa9258a0c61caceaf225e179651397431
    subpath: skills/.curated/security-best-practices
    role: finder
    license: Apache-2.0
    notes: >-
      Repo has no top-level license; the skill directory ships its own Apache-2.0
      LICENSE.txt. Guides for python, JS/TS and Go only. Best-practice oriented, may
      over-report hardening items.

  - id: ecc-security-review
    kind: skill
    repo: https://github.com/affaan-m/ECC
    ref: bf70150eb2df8070024e5bdf08e4aa08959e2735
    subpath: skills/security-review
    role: finder
    license: MIT
    notes: Checklist-style generic security review from a very popular collection (formerly everything-claude-code).

  - id: samber-golang-security
    kind: skill
    repo: https://github.com/samber/cc-skills-golang
    ref: 19a0626ae8565d27a7b7bdf59d8d99d94d7e284c
    subpath: skills/golang-security
    role: finder
    license: MIT
    notes: >-
      Go-only. Useful on warpgate-operator; on dvpwa (python) it acts as an off-topic
      control. May suggest gosec/govulncheck, which are not in the sandbox.

  # --- Trail of Bits plugins (loaded with --plugin-dir) ---------------------------

  - id: tob-sharp-edges
    kind: plugin
    repo: https://github.com/trailofbits/skills
    ref: 32e34f8173796e3566a51aee877dc96bc5191f64
    subpath: plugins/sharp-edges
    role: finder
    license: CC-BY-SA-4.0
    notes: Footguns and misuse-prone API/config design. Read/Grep/Glob only, clean fit for the sandbox.

  - id: tob-differential-review
    kind: plugin
    repo: https://github.com/trailofbits/skills
    ref: 32e34f8173796e3566a51aee877dc96bc5191f64
    subpath: plugins/differential-review
    role: finder
    license: CC-BY-SA-4.0
    notes: >-
      Diff-scoped by design (git blame/log, blast radius). Arenas have no .git, so it has
      to fall back to a whole-tree review. Kept to measure how a diff skill copes with a
      full audit.

  - id: tob-fp-check
    kind: plugin
    repo: https://github.com/trailofbits/skills
    ref: 32e34f8173796e3566a51aee877dc96bc5191f64
    subpath: plugins/fp-check
    role: verifier
    license: CC-BY-SA-4.0
    notes: >-
      Verifier: needs a finder's candidate findings as input, so it is not in r01 of
      2026-09-secure-coding-audit. Ships Stop/SubagentStop prompt hooks and a PoC phase
      that wants Write and test execution.

  - id: tob-entry-point-analyzer
    kind: plugin
    repo: https://github.com/trailofbits/skills
    ref: 32e34f8173796e3566a51aee877dc96bc5191f64
    subpath: plugins/entry-point-analyzer
    role: context
    license: CC-BY-SA-4.0
    notes: Attack-surface mapping pre-pass (smart-contract leaning). Produces context, not findings, so not in r01.

  # --- single-file prompts (wrapped into a SKILL.md by the engine) ----------------

  - id: anthropic-security-review-cmd
    kind: prompt
    repo: https://github.com/anthropics/claude-code-security-review
    ref: 0c6a49f1fa56a1d472575da86a94dbc1edb78eda
    subpath: .claude/commands/security-review.md
    role: finder
    license: MIT
    notes: >-
      The /security-review slash command prompt. Diff-scoped and uses `!git status` /
      `!git diff` preambles plus Task sub-agents for false-positive filtering; with no
      .git and no Task it has to review the tree directly. Named by id so it does not
      collide with the CLI's built-in /security-review.

  - id: every-ce-security-reviewer
    kind: prompt
    repo: https://github.com/EveryInc/compound-engineering-plugin
    ref: 4fbabcd32b6ca7d8ebb82f15840fe34ef7562a64
    subpath: skills/ce-code-review/references/personas/security-reviewer.md
    role: finder
    license: MIT
    notes: >-
      Security persona from the ce-code-review orchestrator (~800 words). The survey listed
      it at plugins/compound-engineering/agents/ce-security-reviewer.md, which does not
      exist at this sha; the persona now lives under skills/ce-code-review/references.
      Refers to a subagent template it does not ship.

  - id: neolab-security-auditor
    kind: prompt
    repo: https://github.com/NeoLabHQ/context-engineering-kit
    ref: 23e2428e809d77717f8acc9659c374a3a1fcb93e
    subpath: plugins/review/agents/security-auditor.md
    role: finder
    license: GPL-3.0
    notes: Subagent definition (~1.5k words) used as a prompt. Frames itself as a local-changes/PR reviewer.

  # --- added 2026-10-03 from contenders/candidates-2026-09-24.yaml ------------------
  - id: github-copilot-security-review
    kind: skill
    repo: https://github.com/github/awesome-copilot
    ref: 1f5644080a525d26a2e24f61a7609fb9b261c21a
    subpath: skills/security-review
    role: finder
    license: MIT
    notes: GitHub's official security-review skill (data flow, self-verification, severity).
  - id: github-copilot-se-security-reviewer
    kind: prompt
    repo: https://github.com/github/awesome-copilot
    ref: 1f5644080a525d26a2e24f61a7609fb9b261c21a
    subpath: agents/se-security-reviewer.agent.md
    role: finder
    license: MIT
    notes: GitHub's security reviewer agent (OWASP Top 10 + LLM Top 10), wrapped as a skill.
  - id: anthropic-security-auditor
    kind: prompt
    repo: https://github.com/anthropics/claude-plugins-official
    ref: 6bfd4e0c6d3da6050984fa5ed8281d915fa7ed69
    subpath: plugins/code-modernization/agents/security-auditor.md
    role: finder
    license: Apache-2.0
    notes: Anthropic's adversarial full-codebase security auditor agent (code-modernization plugin).
  - id: claude-security-researcher
    kind: prompt
    repo: https://github.com/anthropics/claude-plugins-official
    ref: 6bfd4e0c6d3da6050984fa5ed8281d915fa7ed69
    subpath: plugins/claude-security/agents/scan-researcher.md
    role: finder
    license: Apache-2.0
    notes: >-
      The researcher agent of Anthropic's claude-security plugin, run on its own. The full
      product is interactive (AskUserQuestion menu, Workflow scripts, Python helpers, hooks)
      and can't run headless here, so this and claude-security-flat approximate its method.
  - id: claude-security-verifier
    kind: prompt
    repo: https://github.com/anthropics/claude-plugins-official
    ref: 6bfd4e0c6d3da6050984fa5ed8281d915fa7ed69
    subpath: plugins/claude-security/agents/scan-verifier.md
    role: verifier
    license: Apache-2.0
    notes: The claude-security verifier agent (tries to disprove each finding). Used only as a pipeline stage.
  - id: claude-security-flat
    kind: pipeline
    stages: [claude-security-researcher, claude-security-verifier]
    role: finder
    license: Apache-2.0
    notes: >-
      Approximation of claude-security's scan: its researcher, then its verifier over all
      findings in one pass (the product runs per component/lens with a 3-voter panel).
  - id: sentry-then-fp-check
    kind: pipeline
    stages: [sentry-security-review, tob-fp-check]
    role: finder
    notes: Finder + independent verifier, the combination the research recommended.
  - id: gemini-security-analyze-full
